
services:
  # Django-приложение (LabelServerPilot)
  labelpilot:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    command: gunicorn LabelPilotServer.wsgi:application --bind 0.0.0.0:8000 --reload
    volumes:
      - .:/code
      - ./static:/code/static
      - media_volume:/code/media
    env_file:
      - .env
    depends_on:
      - baserow
      - redis
    networks:
      - internal_network
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: docker/celery/Dockerfile
    container_name: celery_worker
    command: celery -A LabelPilotServer worker -l info -P eventlet
    volumes:
      - .:/code
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - internal_network
    environment:
      - CELERY_BROKER_URL=redis://:1234@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:1234@redis:6379/0


  # Celery Beat
  celery_beat:
    build:
      context: .
      dockerfile: docker/celery/Dockerfile
    container_name: celery_beat
    command: celery -A LabelPilotServer beat --loglevel=info
    volumes:
      - .:/code
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - internal_network
    environment:
      - CELERY_BROKER_URL=redis://:1234@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:1234@redis:6379/0

  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--requirepass", "1234"]
    volumes:
      - redis_data:/data
    networks:
      - internal_network

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"  # Пробрасываем Nginx на порт 8000 хоста
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf  # Подключаем конфигурационный файл Nginx
      - ./static:/code/static  # Монтируем статические файлы
      - media_volume:/code/media    # Монтируем медиафайлы
    depends_on:
      - labelpilot
    networks:
      - internal_network

  baserow:
    image: baserow/baserow:latest
    environment:
      BASEROW_PUBLIC_URL: 'http://localhost:3000'
      BASEROW_CADDY_ADDRESSES: ':80'
      BASEROW_EXTRA_ALLOWED_HOSTS: 'localhost,baserow'
    ports:
      - "3000:80"
    volumes:
      - baserow_data:/baserow/data
      - ./config/Caddyfile:/baserow/caddy/Caddyfile  # Монтируем ваш Caddyfile
    networks:
      - internal_network

  flower:
      image: mher/flower:latest
      command: celery --broker=redis://:1234@redis:6379/0 flower --port=5555
      ports:
        - "5555:5555"
      depends_on:
        - redis
        - celery_worker
        - labelpilot
      networks:
        - internal_network


networks:
  internal_network:
    driver: bridge




volumes:
  redis_data:
  baserow_data:
  media_volume:
  static_volume:
